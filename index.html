<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра "Кольца" - Three.js</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #0a0a0a;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 14px;
            backdrop-filter: blur(10px);
        }

        #info-panel h2 {
            margin-bottom: 10px;
            font-size: 18px;
            color: #4fc3f7;
        }

        #info-panel p {
            margin: 5px 0;
        }

        .stat-value {
            color: #ffeb3b;
            font-weight: bold;
        }

        #controls-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            text-align: center;
        }

        #controls-panel h3 {
            margin-bottom: 10px;
            color: #4fc3f7;
        }

        .control-item {
            margin: 5px 0;
        }

        .key {
            background: #333;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            color: #ffeb3b;
        }

        #game-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 30px 50px;
            border-radius: 15px;
            font-size: 24px;
            text-align: center;
            pointer-events: all;
            display: none;
            backdrop-filter: blur(10px);
        }

        #game-message.visible {
            display: block;
        }

        #game-message button {
            margin-top: 20px;
            padding: 10px 30px;
            font-size: 16px;
            background: #4fc3f7;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            transition: background 0.3s;
        }

        #game-message button:hover {
            background: #0288d1;
        }

        .ring-status {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            margin-left: 5px;
        }

        .status-normal { background: #4caf50; }
        .status-fast { background: #ff9800; }
        .status-slow { background: #2196f3; }
        .status-blocked { background: #f44336; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="ui-overlay">
        <div id="info-panel">
            <h2>🎮 Игра "Кольца"</h2>
            <p>Время: <span class="stat-value" id="time-value">0.0</span> сек</p>
            <p>Текущее кольцо: <span class="stat-value" id="current-ring">1</span></p>
            <p>Статус: <span class="stat-value" id="ring-status">Нормальное</span></p>
            <p>Дистанция до цели: <span class="stat-value" id="distance-value">-</span></p>
        </div>

        <div id="controls-panel">
            <h3>⌨️ Управление</h3>
            <div class="control-item"><span class="key">SPACE</span> - Сменить направление на станции</div>
            <div class="control-item"><span class="key">1-5</span> - Перейти на другое кольцо (на станции)</div>
            <div class="control-item"><span class="key">R</span> - Начать заново</div>
        </div>

        <div id="game-message">
            <div id="message-text">Добро пожаловать в игру "Кольца"!</div>
            <button id="start-button">Начать игру</button>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="game.js"></script>
</body>
</html>
