<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Vault - Organize Your Saved Content</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #fafafa;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f5f5f5;
            --text-primary: #1a1a1a;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --border-light: #e5e7eb;
            --border-medium: #d1d5db;
            --accent-blue: #6366f1;
            --accent-blue-soft: #eef2ff;
            --accent-green: #10b981;
            --accent-green-soft: #ecfdf5;
            --accent-orange: #f59e0b;
            --accent-orange-soft: #fffbeb;
            --accent-pink: #ec4899;
            --accent-pink-soft: #fdf2f8;
            --accent-purple: #8b5cf6;
            --accent-purple-soft: #f5f3ff;
            --accent-red: #ef4444;
            --accent-red-soft: #fef2f2;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.08);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: all 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Layout */
        .app-container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-light);
            padding: 24px;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }

        .logo-text {
            font-weight: 600;
            font-size: 18px;
            color: var(--text-primary);
        }

        .search-box {
            position: relative;
            margin-bottom: 24px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            font-size: 14px;
            background: var(--bg-tertiary);
            transition: var(--transition);
            font-family: inherit;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent-blue);
            background: var(--bg-secondary);
            box-shadow: 0 0 0 3px var(--accent-blue-soft);
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
        }

        .nav-section {
            margin-bottom: 24px;
        }

        .nav-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 12px;
            padding: 0 12px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 400;
        }

        .nav-item:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .nav-item.active {
            background: var(--accent-blue-soft);
            color: var(--accent-blue);
            font-weight: 500;
        }

        .nav-item .icon {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }

        .nav-item .count {
            margin-left: auto;
            background: var(--bg-tertiary);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .nav-item.active .count {
            background: rgba(99, 102, 241, 0.2);
            color: var(--accent-blue);
        }

        /* Category colors */
        .category-articles { --category-color: var(--accent-blue); --category-bg: var(--accent-blue-soft); }
        .category-courses { --category-color: var(--accent-green); --category-bg: var(--accent-green-soft); }
        .category-movies { --category-color: var(--accent-pink); --category-bg: var(--accent-pink-soft); }
        .category-podcasts { --category-color: var(--accent-orange); --category-bg: var(--accent-orange-soft); }
        .category-books { --category-color: var(--accent-purple); --category-bg: var(--accent-purple-soft); }
        .category-tools { --category-color: var(--accent-red); --category-bg: var(--accent-red-soft); }

        .category-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--category-color);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 32px 40px;
            max-width: 1200px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .header-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 4px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--accent-blue);
            color: white;
        }

        .btn-primary:hover {
            background: #5558e3;
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: 1px solid var(--border-light);
        }

        .btn-secondary:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        /* View Toggle */
        .view-toggle {
            display: flex;
            background: var(--bg-tertiary);
            border-radius: var(--radius-sm);
            padding: 4px;
        }

        .view-btn {
            padding: 8px 12px;
            border: none;
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-muted);
            transition: var(--transition);
        }

        .view-btn.active {
            background: var(--bg-secondary);
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
        }

        /* Content Grid */
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .content-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 20px;
            transition: var(--transition);
            cursor: pointer;
        }

        .content-card:hover {
            border-color: var(--border-medium);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .card-category {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            background: var(--category-bg);
            color: var(--category-color);
        }

        .card-menu {
            width: 28px;
            height: 28px;
            border: none;
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .card-menu:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .card-title {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 8px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-description {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .card-meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-thumbnail {
            width: 100%;
            height: 140px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-sm);
            margin-bottom: 16px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 32px;
        }

        .card-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Tags */
        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
        }

        .tag {
            padding: 4px 10px;
            background: var(--bg-tertiary);
            border-radius: 6px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 18px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 14px;
            max-width: 300px;
            margin: 0 auto 20px;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            gap: 24px;
            padding: 16px 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            margin-bottom: 24px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .stat-info h4 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .stat-info p {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Add Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 500px;
            padding: 28px;
            box-shadow: var(--shadow-lg);
            transform: scale(0.95);
            transition: var(--transition);
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-header h2 {
            font-size: 20px;
            font-weight: 600;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border: none;
            background: var(--bg-tertiary);
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .modal-close:hover {
            background: var(--border-light);
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: inherit;
            background: var(--bg-secondary);
            transition: var(--transition);
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px var(--accent-blue-soft);
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .sidebar {
                width: 240px;
            }
            .main-content {
                margin-left: 240px;
                padding: 24px;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                z-index: 100;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
            }
            .content-grid {
                grid-template-columns: 1fr;
            }
            .stats-bar {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-icon">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                    </svg>
                </div>
                <span class="logo-text">Content Vault</span>
            </div>

            <div class="search-box">
                <span class="search-icon">
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                </span>
                <input type="text" placeholder="Search content..." id="searchInput">
            </div>

            <nav class="nav-section">
                <div class="nav-title">Library</div>
                <div class="nav-item active" data-filter="all">
                    <span class="icon">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
                        </svg>
                    </span>
                    <span>All Content</span>
                    <span class="count" id="countAll">12</span>
                </div>
                <div class="nav-item" data-filter="favorites">
                    <span class="icon">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                        </svg>
                    </span>
                    <span>Favorites</span>
                    <span class="count">3</span>
                </div>
                <div class="nav-item" data-filter="recent">
                    <span class="icon">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                    </span>
                    <span>Recently Added</span>
                </div>
            </nav>

            <nav class="nav-section">
                <div class="nav-title">Categories</div>
                <div class="nav-item category-articles" data-filter="articles">
                    <span class="category-dot"></span>
                    <span>Blog Articles</span>
                    <span class="count">4</span>
                </div>
                <div class="nav-item category-courses" data-filter="courses">
                    <span class="category-dot"></span>
                    <span>Courses</span>
                    <span class="count">2</span>
                </div>
                <div class="nav-item category-movies" data-filter="movies">
                    <span class="category-dot"></span>
                    <span>Movies</span>
                    <span class="count">3</span>
                </div>
                <div class="nav-item category-podcasts" data-filter="podcasts">
                    <span class="category-dot"></span>
                    <span>Podcasts</span>
                    <span class="count">1</span>
                </div>
                <div class="nav-item category-books" data-filter="books">
                    <span class="category-dot"></span>
                    <span>Books</span>
                    <span class="count">2</span>
                </div>
                <div class="nav-item category-tools" data-filter="tools">
                    <span class="category-dot"></span>
                    <span>Tools & Resources</span>
                    <span class="count">0</span>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div>
                    <h1>All Content</h1>
                    <p class="header-subtitle">Your curated collection of saved items</p>
                </div>
                <div class="header-actions">
                    <div class="view-toggle">
                        <button class="view-btn active" data-view="grid">
                            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
                            </svg>
                        </button>
                        <button class="view-btn" data-view="list">
                            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                            </svg>
                        </button>
                    </div>
                    <button class="btn btn-secondary">
                        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/>
                        </svg>
                        Filter
                    </button>
                    <button class="btn btn-primary" id="addContentBtn">
                        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                        </svg>
                        Add Content
                    </button>
                </div>
            </header>

            <!-- Stats -->
            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-icon" style="background: var(--accent-blue-soft); color: var(--accent-blue);">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                        </svg>
                    </div>
                    <div class="stat-info">
                        <h4>12</h4>
                        <p>Total Items</p>
                    </div>
                </div>
                <div class="stat-item">
                    <div class="stat-icon" style="background: var(--accent-green-soft); color: var(--accent-green);">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                    </div>
                    <div class="stat-info">
                        <h4>5</h4>
                        <p>Completed</p>
                    </div>
                </div>
                <div class="stat-item">
                    <div class="stat-icon" style="background: var(--accent-orange-soft); color: var(--accent-orange);">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                    </div>
                    <div class="stat-info">
                        <h4>3</h4>
                        <p>In Progress</p>
                    </div>
                </div>
                <div class="stat-item">
                    <div class="stat-icon" style="background: var(--accent-purple-soft); color: var(--accent-purple);">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
                        </svg>
                    </div>
                    <div class="stat-info">
                        <h4>4</h4>
                        <p>Saved for Later</p>
                    </div>
                </div>
            </div>

            <!-- Content Grid -->
            <div class="content-grid" id="contentGrid">
                <!-- Cards will be rendered here -->
            </div>
        </main>
    </div>

    <!-- Add Content Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2>Add New Content</h2>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <form id="addContentForm">
                <div class="form-group">
                    <label for="contentUrl">URL</label>
                    <input type="url" id="contentUrl" placeholder="https://example.com/article" required>
                </div>
                <div class="form-group">
                    <label for="contentTitle">Title</label>
                    <input type="text" id="contentTitle" placeholder="Enter title" required>
                </div>
                <div class="form-group">
                    <label for="contentCategory">Category</label>
                    <select id="contentCategory" required>
                        <option value="">Select a category</option>
                        <option value="articles">Blog Articles</option>
                        <option value="courses">Courses</option>
                        <option value="movies">Movies</option>
                        <option value="podcasts">Podcasts</option>
                        <option value="books">Books</option>
                        <option value="tools">Tools & Resources</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="contentDescription">Description (optional)</label>
                    <textarea id="contentDescription" placeholder="Add a short description..."></textarea>
                </div>
                <div class="form-group">
                    <label for="contentTags">Tags (optional)</label>
                    <input type="text" id="contentTags" placeholder="design, productivity, learning">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Content</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Sample data
        const sampleContent = [
            {
                id: 1,
                title: "The Complete Guide to Modern CSS",
                description: "An in-depth exploration of CSS Grid, Flexbox, and modern layout techniques that every developer should know.",
                category: "articles",
                url: "https://example.com/css-guide",
                tags: ["css", "web development", "design"],
                source: "CSS Tricks",
                date: "2024-01-15",
                readTime: "12 min read",
                favorite: true
            },
            {
                id: 2,
                title: "Machine Learning Fundamentals",
                description: "A comprehensive course covering the basics of machine learning, neural networks, and practical applications.",
                category: "courses",
                url: "https://example.com/ml-course",
                tags: ["machine learning", "AI", "python"],
                source: "Coursera",
                date: "2024-01-10",
                duration: "40 hours",
                progress: 65
            },
            {
                id: 3,
                title: "Dune: Part Two",
                description: "The epic continuation of Paul Atreides' journey as he unites with Chani and the Fremen.",
                category: "movies",
                url: "https://example.com/dune-2",
                tags: ["sci-fi", "epic", "2024"],
                source: "IMDB",
                date: "2024-03-01",
                duration: "2h 46m",
                rating: "8.8"
            },
            {
                id: 4,
                title: "Atomic Habits",
                description: "James Clear's guide to building good habits and breaking bad ones through small, incremental changes.",
                category: "books",
                url: "https://example.com/atomic-habits",
                tags: ["productivity", "self-improvement"],
                source: "Goodreads",
                date: "2023-12-20",
                author: "James Clear",
                favorite: true
            },
            {
                id: 5,
                title: "The Design Better Podcast",
                description: "Weekly conversations with design leaders about craft, culture, and career.",
                category: "podcasts",
                url: "https://example.com/design-podcast",
                tags: ["design", "career", "interviews"],
                source: "Spotify",
                date: "2024-01-20",
                episodes: "120+"
            },
            {
                id: 6,
                title: "Understanding TypeScript",
                description: "A practical guide to TypeScript for JavaScript developers with real-world examples.",
                category: "articles",
                url: "https://example.com/typescript",
                tags: ["typescript", "javascript"],
                source: "Medium",
                date: "2024-01-18",
                readTime: "8 min read"
            },
            {
                id: 7,
                title: "Oppenheimer",
                description: "The story of American scientist J. Robert Oppenheimer and his role in the development of the atomic bomb.",
                category: "movies",
                url: "https://example.com/oppenheimer",
                tags: ["biography", "drama", "history"],
                source: "IMDB",
                date: "2023-07-21",
                duration: "3h",
                rating: "8.4"
            },
            {
                id: 8,
                title: "React Performance Optimization",
                description: "Learn advanced techniques for optimizing React applications including memoization and code splitting.",
                category: "courses",
                url: "https://example.com/react-perf",
                tags: ["react", "performance", "javascript"],
                source: "Frontend Masters",
                date: "2024-01-05",
                duration: "6 hours",
                progress: 30
            },
            {
                id: 9,
                title: "The Psychology of Money",
                description: "Timeless lessons on wealth, greed, and happiness from Morgan Housel.",
                category: "books",
                url: "https://example.com/psychology-money",
                tags: ["finance", "psychology"],
                source: "Goodreads",
                date: "2024-01-08",
                author: "Morgan Housel"
            },
            {
                id: 10,
                title: "Building Accessible UIs",
                description: "Best practices for creating inclusive and accessible user interfaces that work for everyone.",
                category: "articles",
                url: "https://example.com/accessibility",
                tags: ["accessibility", "UI", "best practices"],
                source: "A11y Project",
                date: "2024-01-22",
                readTime: "15 min read",
                favorite: true
            },
            {
                id: 11,
                title: "Poor Things",
                description: "The incredible tale of Bella Baxter, a young woman brought back to life by an eccentric scientist.",
                category: "movies",
                url: "https://example.com/poor-things",
                tags: ["drama", "comedy", "fantasy"],
                source: "IMDB",
                date: "2023-12-08",
                duration: "2h 21m",
                rating: "8.0"
            },
            {
                id: 12,
                title: "System Design Interview Prep",
                description: "A comprehensive guide to acing system design interviews at top tech companies.",
                category: "articles",
                url: "https://example.com/system-design",
                tags: ["system design", "interviews", "architecture"],
                source: "ByteByteGo",
                date: "2024-01-25",
                readTime: "20 min read"
            }
        ];

        // Category icons/emojis
        const categoryIcons = {
            articles: '📄',
            courses: '🎓',
            movies: '🎬',
            podcasts: '🎧',
            books: '📚',
            tools: '🛠️'
        };

        const categoryNames = {
            articles: 'Article',
            courses: 'Course',
            movies: 'Movie',
            podcasts: 'Podcast',
            books: 'Book',
            tools: 'Tool'
        };

        // State
        let contentData = [...sampleContent];
        let currentFilter = 'all';
        let searchQuery = '';

        // DOM Elements
        const contentGrid = document.getElementById('contentGrid');
        const searchInput = document.getElementById('searchInput');
        const modalOverlay = document.getElementById('modalOverlay');
        const addContentBtn = document.getElementById('addContentBtn');
        const modalClose = document.getElementById('modalClose');
        const cancelBtn = document.getElementById('cancelBtn');
        const addContentForm = document.getElementById('addContentForm');
        const navItems = document.querySelectorAll('.nav-item');
        const viewBtns = document.querySelectorAll('.view-btn');

        // Render content cards
        function renderContent() {
            let filtered = contentData;

            // Apply category filter
            if (currentFilter !== 'all' && currentFilter !== 'favorites' && currentFilter !== 'recent') {
                filtered = filtered.filter(item => item.category === currentFilter);
            } else if (currentFilter === 'favorites') {
                filtered = filtered.filter(item => item.favorite);
            } else if (currentFilter === 'recent') {
                filtered = [...filtered].sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 5);
            }

            // Apply search filter
            if (searchQuery) {
                const query = searchQuery.toLowerCase();
                filtered = filtered.filter(item =>
                    item.title.toLowerCase().includes(query) ||
                    item.description.toLowerCase().includes(query) ||
                    item.tags.some(tag => tag.toLowerCase().includes(query))
                );
            }

            if (filtered.length === 0) {
                contentGrid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-state-icon">📭</div>
                        <h3>No content found</h3>
                        <p>Try adjusting your search or filters, or add some new content to get started.</p>
                        <button class="btn btn-primary" onclick="openModal()">Add Content</button>
                    </div>
                `;
                return;
            }

            contentGrid.innerHTML = filtered.map(item => `
                <div class="content-card" onclick="window.open('${item.url}', '_blank')">
                    <div class="card-header">
                        <span class="card-category category-${item.category}">
                            ${categoryIcons[item.category]} ${categoryNames[item.category]}
                        </span>
                        <button class="card-menu" onclick="event.stopPropagation()">
                            <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
                                <circle cx="12" cy="5" r="2"/>
                                <circle cx="12" cy="12" r="2"/>
                                <circle cx="12" cy="19" r="2"/>
                            </svg>
                        </button>
                    </div>
                    <h3 class="card-title">${item.title}</h3>
                    <p class="card-description">${item.description}</p>
                    <div class="card-meta">
                        <span class="card-meta-item">
                            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
                            </svg>
                            ${item.source}
                        </span>
                        <span class="card-meta-item">
                            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                            </svg>
                            ${formatDate(item.date)}
                        </span>
                        ${item.readTime ? `<span class="card-meta-item">${item.readTime}</span>` : ''}
                        ${item.duration ? `<span class="card-meta-item">${item.duration}</span>` : ''}
                        ${item.rating ? `<span class="card-meta-item">⭐ ${item.rating}</span>` : ''}
                    </div>
                    ${item.tags && item.tags.length > 0 ? `
                        <div class="card-tags">
                            ${item.tags.slice(0, 3).map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                    ` : ''}
                    ${item.progress !== undefined ? `
                        <div style="margin-top: 12px;">
                            <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">
                                <span>Progress</span>
                                <span>${item.progress}%</span>
                            </div>
                            <div style="height: 4px; background: var(--bg-tertiary); border-radius: 2px; overflow: hidden;">
                                <div style="height: 100%; width: ${item.progress}%; background: var(--accent-green); border-radius: 2px;"></div>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        // Format date
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const now = new Date();
            const diff = Math.floor((now - date) / (1000 * 60 * 60 * 24));

            if (diff === 0) return 'Today';
            if (diff === 1) return 'Yesterday';
            if (diff < 7) return `${diff} days ago`;

            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        // Modal functions
        function openModal() {
            modalOverlay.classList.add('active');
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            addContentForm.reset();
        }

        // Event Listeners
        addContentBtn.addEventListener('click', openModal);
        modalClose.addEventListener('click', closeModal);
        cancelBtn.addEventListener('click', closeModal);

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        addContentForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const newContent = {
                id: Date.now(),
                title: document.getElementById('contentTitle').value,
                description: document.getElementById('contentDescription').value || 'No description provided.',
                category: document.getElementById('contentCategory').value,
                url: document.getElementById('contentUrl').value,
                tags: document.getElementById('contentTags').value.split(',').map(t => t.trim()).filter(t => t),
                source: new URL(document.getElementById('contentUrl').value).hostname,
                date: new Date().toISOString().split('T')[0]
            };

            contentData.unshift(newContent);
            updateCounts();
            renderContent();
            closeModal();
        });

        // Search
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderContent();
        });

        // Navigation
        navItems.forEach(item => {
            item.addEventListener('click', () => {
                navItems.forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                currentFilter = item.dataset.filter;

                // Update header title
                const header = document.querySelector('.header h1');
                const filterNames = {
                    all: 'All Content',
                    favorites: 'Favorites',
                    recent: 'Recently Added',
                    articles: 'Blog Articles',
                    courses: 'Courses',
                    movies: 'Movies',
                    podcasts: 'Podcasts',
                    books: 'Books',
                    tools: 'Tools & Resources'
                };
                header.textContent = filterNames[currentFilter] || 'All Content';

                renderContent();
            });
        });

        // View toggle
        viewBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                viewBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                // Could implement list view here
            });
        });

        // Update category counts
        function updateCounts() {
            const counts = {
                all: contentData.length,
                articles: contentData.filter(i => i.category === 'articles').length,
                courses: contentData.filter(i => i.category === 'courses').length,
                movies: contentData.filter(i => i.category === 'movies').length,
                podcasts: contentData.filter(i => i.category === 'podcasts').length,
                books: contentData.filter(i => i.category === 'books').length,
                tools: contentData.filter(i => i.category === 'tools').length
            };

            document.getElementById('countAll').textContent = counts.all;

            navItems.forEach(item => {
                const filter = item.dataset.filter;
                const countEl = item.querySelector('.count');
                if (countEl && counts[filter] !== undefined) {
                    countEl.textContent = counts[filter];
                }
            });
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
            if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                e.preventDefault();
                searchInput.focus();
            }
        });

        // Initial render
        renderContent();
    </script>
</body>
</html>
